<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecJIT Scan</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="screens/screens.css">
</head>
<body data-chrome="app">
<a class="skip" href="#main">Bỏ qua điều hướng</a>
<header id="hdr" class="hdr" role="banner">
  <span class="hdr-logo" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7FC4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
  </span>
  <strong class="hdr-app">SecJIT Scan</strong>
  <span id="hdr-sub" class="hdr-sub"></span>
  <span class="hdr-spacer"></span>
  <a id="hdr-docker" class="chip chip-dark" href="#/preflight" aria-live="polite">Docker …</a>
  <label class="sr-only" for="hdr-lang">Ngôn ngữ</label>
  <select id="hdr-lang" class="hdr-select" aria-label="Ngôn ngữ">
    <option value="vi">Tiếng Việt</option>
    <option value="en">English</option>
  </select>
</header>
<div id="stepper-slot"></div>
<div id="shell" class="shell">
  <nav id="nav" class="nav" aria-label="Điều hướng chính"></nav>
  <main id="main" class="app-main" tabindex="-1"></main>
</div>
<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="dialogs"></div>
<script type="module" src="app.js"></script>
</body>
</html>
